name: Build desktop apps

# Every push to main builds Windows, macOS and Linux installers in parallel
# and publishes them to the GitHub Release for the version in package.json.
on:
  push:
    branches: [main, ci-test]
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels the older, still-running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: build:win
          - name: macOS
            os: macos-latest
            script: build:mac
          - name: Linux
            os: ubuntu-latest
            script: build:linux
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run ${{ matrix.script }}

      - name: List output
        shell: bash
        run: ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Sync web app into Android project
        run: npm run android:sync

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk/MCSOUNDS-${VERSION}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-android
          if-no-files-found: error
          path: apk/*.apk

  release:
    name: Publish GitHub Release
    needs: [build, android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Read version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: List files to publish
        run: ls -lh release

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MCSOUNDS v${{ steps.ver.outputs.version }}
          files: release/*
          overwrite_files: true
          make_latest: true
          generate_release_notes: true
