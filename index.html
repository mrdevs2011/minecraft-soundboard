<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MCSND — Minecraft Sound Archive</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050505;
  --bg2: #0c0c0c;
  --surface: #121212;
  --surface2: #1a1a1a;
  --border: #2a2a2a;
  --border2: #3d3d3d;
  --text: #f5f5f5;
  --muted: #8a8a8a;
  --dim: #555;
  --invert: #ffffff;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
[data-theme="light"] {
  --bg: #f4f4f4;
  --bg2: #ebebeb;
  --surface: #ffffff;
  --surface2: #f0f0f0;
  --border: #d4d4d4;
  --border2: #b8b8b8;
  --text: #0a0a0a;
  --muted: #666;
  --dim: #999;
  --invert: #000000;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: "Syne", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
  line-height: 1.4;
}
/* grain */
body::before {
  content: "";
  position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: .04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
/* scanline */
body::after {
  content: "";
  position: fixed; inset: 0; z-index: 9998; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(128,128,128,.015) 2px, rgba(128,128,128,.015) 4px);
}

/* ===== HEADER ===== */
.top {
  position: sticky; top: 0; z-index: 100;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(16px) saturate(1.2);
  border-bottom: 1px solid var(--border);
  padding: 0 clamp(12px, 3vw, 28px);
}
.top-inner {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  min-height: 56px;
  max-width: 1600px;
  margin: 0 auto;
}
@media (max-width: 720px) {
  .top-inner { grid-template-columns: auto 1fr; grid-template-rows: auto auto; gap: 8px; padding: 10px 0; }
  .top-actions { grid-column: 1 / -1; justify-content: space-between; }
}
.brand {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--text);
}
.brand-mark {
  width: 28px; height: 28px; border: 1.5px solid var(--text);
  display: grid; place-items: center; flex-shrink: 0;
}
.brand-mark svg { width: 14px; height: 14px; }
.brand-text {
  font-weight: 800; font-size: 15px; letter-spacing: .12em; text-transform: uppercase;
}
.brand-text span { color: var(--muted); font-weight: 500; }
.search-wrap { position: relative; max-width: 480px; width: 100%; justify-self: center; }
.search-wrap svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; opacity: .45; pointer-events: none;
}
.search-wrap input {
  width: 100%; height: 40px; padding: 0 14px 0 38px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  font-family: "IBM Plex Mono", monospace; font-size: 13px; outline: none;
  border-radius: 0; transition: border-color .15s;
}
.search-wrap input:focus { border-color: var(--text); }
.search-wrap input::placeholder { color: var(--dim); }
.top-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.icon-btn {
  height: 36px; min-width: 36px; padding: 0 10px;
  background: transparent; border: 1px solid var(--border); color: var(--text);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; font-family: "IBM Plex Mono", monospace; font-size: 11px;
  letter-spacing: .04em; text-transform: uppercase; transition: .15s;
}
.icon-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.icon-btn:hover, .icon-btn.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.icon-btn.on svg, .icon-btn:hover svg { stroke: currentColor; }
.meta-count {
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--muted);
  letter-spacing: .08em; white-space: nowrap;
}

/* ===== SHELL ===== */
.shell {
  display: grid;
  grid-template-columns: 200px minmax(0, 1fr);
  max-width: 1600px; margin: 0 auto;
  min-height: calc(100dvh - 56px);
}
.shell.chat-on { grid-template-columns: 200px minmax(0, 1fr) minmax(280px, 360px); }
@media (max-width: 1100px) {
  .shell, .shell.chat-on { grid-template-columns: 160px minmax(0, 1fr); }
  .chat { position: fixed; right: 0; top: 56px; bottom: 0; width: min(360px, 100vw); z-index: 80;
    transform: translateX(100%); transition: transform .25s ease; border-left: 1px solid var(--border); }
  .shell.chat-on .chat { transform: translateX(0); }
}
@media (max-width: 720px) {
  .shell, .shell.chat-on { grid-template-columns: 1fr; }
  .nav { display: none; }
  .nav.open {
    display: block; position: fixed; inset: 56px 0 0 0; z-index: 70;
    background: var(--bg); overflow-y: auto; padding: 16px;
  }
}

/* NAV */
.nav {
  border-right: 1px solid var(--border); background: var(--bg2);
  padding: 16px 10px; overflow-y: auto; max-height: calc(100dvh - 56px);
  position: sticky; top: 56px;
}
.nav-label {
  font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--dim); padding: 0 8px 10px;
}
.nav-item {
  width: 100%; display: flex; justify-content: space-between; align-items: center;
  padding: 9px 10px; border: 1px solid transparent; background: transparent;
  color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 11px;
  cursor: pointer; text-align: left; transition: .12s; margin-bottom: 2px;
}
.nav-item:hover { color: var(--text); border-color: var(--border); background: var(--surface); }
.nav-item.active {
  color: var(--bg); background: var(--text); border-color: var(--text); font-weight: 600;
}
.nav-item .n {
  font-size: 9px; opacity: .7; border: 1px solid currentColor; padding: 1px 5px;
}

/* MAIN */
.stage { padding: clamp(12px, 2.5vw, 24px); overflow-y: auto; }

/* player — fixed float, always on top while open */
.player {
  display: none;
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  z-index: 200;
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(18px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,.45);
  max-width: 720px;
  margin: 0 auto;
}
.player.show { display: block; }
@media (min-width: 900px) {
  .player { left: 50%; right: auto; transform: translateX(-50%); width: min(720px, calc(100vw - 24px)); }
}
.stage { padding-bottom: 120px; }
.player-inner { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.player-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.player-ico {
  width: 40px; height: 40px; border: 1px solid var(--text);
  display: grid; place-items: center; flex-shrink: 0; background: var(--text); color: var(--bg);
}
.player-ico svg { width: 16px; height: 16px; }
.player-meta { flex: 1; min-width: 0; }
.player-name {
  font-weight: 700; font-size: 14px; letter-spacing: .02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.player-path {
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
}
.player-ctrls { display: flex; gap: 6px; align-items: center; }
.prog {
  display: grid; grid-template-columns: 40px 1fr 40px; gap: 10px; align-items: center;
}
.prog time {
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--muted);
}
.prog time:last-child { text-align: right; }
.track {
  height: 3px; background: var(--border); cursor: pointer; position: relative;
}
.track:hover { height: 5px; }
.fill {
  height: 100%; width: 0%; background: var(--text); position: relative;
}
.fill::after {
  content: ""; position: absolute; right: -4px; top: 50%; transform: translateY(-50%);
  width: 9px; height: 9px; background: var(--text); border-radius: 50%; opacity: 0;
}
.track:hover .fill::after { opacity: 1; }
.vol { width: 72px; accent-color: var(--text); height: 3px; }

/* grid */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
  gap: 8px;
}
.card {
  position: relative; background: var(--surface); border: 1px solid var(--border);
  padding: 12px 14px; display: flex; align-items: center; gap: 12px;
  cursor: pointer; transition: .15s; user-select: none;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
}
.card::before, .card::after {
  content: ""; position: absolute; width: 8px; height: 8px; border-color: var(--dim); border-style: solid;
}
.card::before { top: 4px; left: 4px; border-width: 1px 0 0 1px; }
.card::after { bottom: 4px; right: 4px; border-width: 0 1px 1px 0; }
.card:hover {
  border-color: var(--text); background: var(--surface2);
  transform: translateY(-2px);
}
.card.playing {
  border-color: var(--text); background: var(--text); color: var(--bg);
}
.card.playing .card-path { color: color-mix(in srgb, var(--bg) 55%, transparent); }
.card.playing .card-play { background: var(--bg); color: var(--text); border-color: var(--bg); }
.card-play {
  width: 34px; height: 34px; border: 1px solid var(--border2);
  display: grid; place-items: center; flex-shrink: 0; transition: .15s;
}
.card-play svg { width: 12px; height: 12px; }
.card:hover .card-play { border-color: var(--text); background: var(--text); color: var(--bg); }
.card-body { min-width: 0; flex: 1; }
.card-name {
  font-size: 13px; font-weight: 600; letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-path {
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px;
}

.empty {
  grid-column: 1 / -1; text-align: center; padding: 64px 20px; color: var(--muted);
}
.empty h2 { font-size: 18px; color: var(--text); margin-bottom: 8px; font-weight: 700; }
.load {
  grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 40vh; gap: 14px;
}
.load-bar { width: min(280px, 70vw); height: 2px; background: var(--border); overflow: hidden; }
.load-fill { height: 100%; width: 0%; background: var(--text); transition: width .3s; }
.load-txt { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted); letter-spacing: .1em; }

/* CHAT */
.chat {
  display: none; flex-direction: column; background: var(--bg2);
  border-left: 1px solid var(--border); max-height: calc(100dvh - 56px);
  position: sticky; top: 56px;
}
.shell.chat-on .chat { display: flex; }
.chat-hd {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.chat-hd h3 {
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.chat-hd h3 svg { width: 14px; height: 14px; }
.chat-cfg {
  padding: 12px; border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px;
}
.chat-cfg label {
  font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--dim);
}
.chat-cfg input, .chat-cfg select {
  width: 100%; height: 36px; padding: 0 10px; background: var(--surface);
  border: 1px solid var(--border); color: var(--text);
  font-family: "IBM Plex Mono", monospace; font-size: 12px; outline: none; border-radius: 0;
}
.chat-cfg input:focus, .chat-cfg select:focus { border-color: var(--text); }
.chat-log {
  flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px;
}
.bubble {
  max-width: 94%; padding: 10px 12px; font-size: 13px; line-height: 1.45;
  border: 1px solid var(--border); word-break: break-word;
}
.bubble.user { align-self: flex-end; background: var(--text); color: var(--bg); border-color: var(--text); }
.bubble.ai { align-self: flex-start; background: var(--surface); }
.bubble.sys {
  align-self: center; border: none; background: transparent; color: var(--muted);
  font-family: "IBM Plex Mono", monospace; font-size: 11px;
}
.bubble .hint {
  margin-top: 8px; padding: 8px 10px; border: 1px dashed var(--border2);
  font-family: "IBM Plex Mono", monospace; font-size: 11px; cursor: pointer;
}
.bubble .hint:hover { border-style: solid; border-color: var(--text); }
.bubble .chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  font-family: "IBM Plex Mono", monospace; font-size: 10px; padding: 5px 9px;
  border: 1px solid var(--border2); cursor: pointer; background: var(--bg);
  display: inline-flex; align-items: center; gap: 5px;
}
.chip svg { width: 10px; height: 10px; }
.chip:hover { background: var(--text); color: var(--bg); border-color: var(--text); }
.chat-in {
  padding: 10px 12px calc(10px + var(--safe-b)); border-top: 1px solid var(--border);
  display: flex; gap: 8px;
}
.chat-in input {
  flex: 1; height: 40px; padding: 0 12px; background: var(--surface);
  border: 1px solid var(--border); color: var(--text);
  font-family: "IBM Plex Mono", monospace; font-size: 13px; outline: none; border-radius: 0;
}
.chat-in input:focus { border-color: var(--text); }
.chat-in button {
  height: 40px; padding: 0 16px; background: var(--text); color: var(--bg);
  border: 1px solid var(--text); font-family: "Syne", sans-serif; font-weight: 700;
  font-size: 12px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
}
.chat-in button:disabled { opacity: .4; cursor: not-allowed; }

.backdrop {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 75;
}
.shell.chat-on .backdrop { display: block; }
@media (min-width: 1101px) { .backdrop { display: none !important; } }
</style>
</head>
<body data-theme="dark">
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h3l2-7 4 14 2-7h5"/></svg>
      </div>
      <div class="brand-text">MC<span>SND</span></div>
    </a>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
      <input type="search" id="search" placeholder="Filter archive..." autocomplete="off">
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnNav" title="Categories" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <button class="icon-btn" id="btnRand" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h6v6H4zM14 14h6v6h-6zM14 4l6 6M4 20l6-6"/></svg>
        <span>RND</span>
      </button>
      <button class="icon-btn" id="btnStop" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12"/></svg>
      </button>
      <button class="icon-btn" id="btnTheme" type="button" title="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="themeIcon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="btnChat" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16v10H8l-4 4V6z"/></svg>
        <span>AI</span>
      </button>
      <span class="meta-count" id="stats">—</span>
    </div>
  </div>
</header>

<div class="backdrop" id="backdrop"></div>

<div class="shell" id="shell">
  <nav class="nav" id="nav"></nav>

  <main class="stage">
    <div class="player" id="player">
      <div class="player-inner">
        <div class="player-row">
          <div class="player-ico" id="pIco">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <div class="player-meta">
            <div class="player-name" id="pName">—</div>
            <div class="player-path" id="pPath">—</div>
          </div>

            <input type="range" class="vol" id="vol" min="0" max="1" step="0.05" value="0.7">
            <button class="icon-btn" id="pPause" type="button">
              <svg viewBox="0 0 24 24" fill="currentColor" id="pPauseSvg"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
            </button>
            <button class="icon-btn" id="pStop" type="button">
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>

      <input type="text" id="chatInput" placeholder="Qanday ovoz?" autocomplete="off">
      <button type="button" id="chatSend">Send</button>
    </div>
  </aside>
</div>

<script>
const BASE = "sounds/";
let data = null, all = [], audio = null, cardEl = null, cat = "all", seeking = false, raf = null, hist = [];

const $ = (id) => document.getElementById(id);

function fmt(s) {
  if (!isFinite(s) || s < 0) return "0:00";
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m + ":" + String(sec).padStart(2, "0");
}
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML.replace(/"/g, "&" + "quot;");
}

async function init() {
  try {
    $("loadFill").style.width = "25%";
    $("loadTxt").textContent = "FETCHING INDEX";
    const res = await fetch("sounds.json");
    $("loadFill").style.width = "60%";
    data = await res.json();
    all = [];
    for (const c of data.categories) for (const p of (data.sounds[c] || [])) all.push({ path: p, cat: c });
    $("stats").textContent = data.total.toLocaleString() + " FILES";
    $("loadFill").style.width = "100%";
    $("loadTxt").textContent = "READY";
    buildNav();
    setTimeout(() => render("all"), 120);
    bind();
    const k = localStorage.getItem("groq_api_key");
    const m = localStorage.getItem("groq_model");
    const th = localStorage.getItem("mcsnd_theme");
    if (k) $("groqKey").value = k;
    const blocked = ["llama-3.3-70b-versatile", "mixtral-8x7b-32768", "gemma2-9b-it"];
    if (m && !blocked.includes(m) && Array.from($("groqModel").options).some(o => o.value === m)) {
      $("groqModel").value = m;
    } else {
      $("groqModel").value = "openai/gpt-oss-20b";
      localStorage.setItem("groq_model", "openai/gpt-oss-20b");
    }
    if (th === "light") setTheme("light");
  } catch (e) {
    $("grid").innerHTML = "<div class=\"empty\"><h2>LOAD FAILED</h2><p>" + esc(e.message) + "</p></div>";
  }
}

function setTheme(t) {
  document.body.setAttribute("data-theme", t);
  localStorage.setItem("mcsnd_theme", t);
}

function buildNav() {
  let h = "<div class=\"nav-label\">Categories</div>";
  h += "<button class=\"nav-item active\" data-c=\"all\"><span>ALL</span><span class=\"n\">" + data.total + "</span></button>";
  for (const c of data.categories) {
    const n = (data.sounds[c] || []).length;
    h += "<button class=\"nav-item\" data-c=\"" + esc(c) + "\"><span>" + esc(c) + "</span><span class=\"n\">" + n + "</span></button>";
  }
  $("nav").innerHTML = h;
  $("nav").querySelectorAll(".nav-item").forEach(btn => {
    btn.addEventListener("click", () => {
      $("nav").querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      cat = btn.dataset.c;
      $("search").value = "";
      render(cat);
      $("nav").classList.remove("open");
    });
  });
}

function filterList(c, q) {
  let list = c === "all" ? all.slice() : all.filter(s => s.cat === c);
  if (q) {
    const tokens = q.toLowerCase().trim().split(/\s+/).filter(Boolean);
    list = list.filter(s => tokens.every(t => s.path.toLowerCase().includes(t)));
  }
  return list;
}

function searchLib(query, limit) {
  limit = limit || 40;
  const aliases = {
    "mol": "cow", "sigir": "cow", "cow": "cow",
    "tovuq": "chicken", "chicken": "chicken",
    "chochqa": "pig", "pig": "pig",
    "qoy": "sheep", "sheep": "sheep",
    "ot": "horse", "horse": "horse",
    "it": "wolf", "wolf": "wolf", "kuchuk": "wolf",
    "mushuk": "cat", "cat": "cat",
    "zombi": "zombie", "zombie": "zombie",
    "skelet": "skeleton", "skeleton": "skeleton",
    "kriper": "creeper", "creeper": "creeper",
    "enderman": "enderman", "ender": "enderman",
    "orgimchak": "spider", "spider": "spider",
    "slime": "slime", "ghast": "ghast", "portal": "portal",
    "yomgir": "rain", "rain": "rain", "eshik": "door", "door": "door",
    "suv": "water", "water": "water", "lava": "lava",
    "otash": "fire", "fire": "fire", "musiqa": "music", "music": "music",
    "nota": "note", "qilich": "sword", "sword": "sword",
    "blok": "block", "block": "block", "yurish": "step", "step": "step",
    "portlash": "explode", "explode": "explode", "zarar": "hurt", "hurt": "hurt",
    "olim": "death", "death": "death", "ambient": "ambient", "sut": "milk", "milk": "milk"
  };
  const q = query.toLowerCase();
  const tokens = q.split(/[^a-zA-Z0-9_\u0400-\u04FF]+/).filter(t => t.length > 1);
  const terms = new Set();
  tokens.forEach(t => { terms.add(t); if (aliases[t]) terms.add(aliases[t]); });
  if (!terms.size) terms.add(q);
  const scored = [];
  for (const s of all) {
    const p = s.path.toLowerCase();
    let score = 0;
    for (const t of terms) {
      if (p.includes(t)) score += t.length + (p.split("/").pop().includes(t) ? 5 : 0);
    }
    if (score) scored.push(Object.assign({}, s, { score: score }));
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, limit);
}

function render(c, q) {
  q = q || "";
  const list = filterList(c, q);
  const grid = $("grid");
  if (!list.length) {
    grid.innerHTML = "<div class=\"empty\"><h2>NO MATCH</h2><p>Try another filter</p></div>";
    return;
  }
  const MAX = 400;
  const slice = list.slice(0, MAX);
  let h = "";
  for (const s of slice) {
    const name = s.path.split("/").pop().replace(/\.ogg$/i, "");
    h += "<div class=\"card\" data-path=\"" + esc(s.path) + "\" data-cat=\"" + esc(s.cat) + "\">" +
      "<div class=\"card-play\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"/></svg></div>" +
      "<div class=\"card-body\"><div class=\"card-name\">" + esc(name) + "</div>" +
      "<div class=\"card-path\">" + esc(s.path) + "</div></div></div>";
  }
  if (list.length > MAX) h += "<div class=\"empty\"><p>Showing " + MAX + " / " + list.length + "</p></div>";
  grid.innerHTML = h;
  grid.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => play(el.dataset.path, el.dataset.cat, el));
    el.addEventListener("mouseenter", () => {
      const u = BASE + el.dataset.path.split("/").map(encodeURIComponent).join("/");
      const link = document.createElement("link");
      link.rel = "prefetch";
      link.as = "audio";
      link.href = u;
      document.head.appendChild(link);
    }, { once: true });
  });
}

function tick() {
  if (!audio || seeking) return;
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  $("fill").style.width = pct + "%";
  $("tCur").textContent = fmt(audio.currentTime);
  $("tTot").textContent = fmt(audio.duration);
  raf = requestAnimationFrame(tick);
}

function play(path, c, el) {
  stop(false);
  if (cardEl) cardEl.classList.remove("playing");
  cardEl = el || null;
  if (el) el.classList.add("playing");
  $("player").classList.add("show");
  $("pName").textContent = path.split("/").pop();
  $("pPath").textContent = "LOADING  ·  " + path;
  $("fill").style.width = "0%";
  $("tCur").textContent = "0:00";
  $("tTot").textContent = "...";
  $("pPauseSvg").innerHTML = "<path d=\"M6 5h4v14H6zm8 0h4v14h-4z\"/>";

  const url = BASE + path.split("/").map(encodeURIComponent).join("/");
  let tries = 0;

  function bindAudio(a, fromBlob) {
    a.preload = "auto";
    a.volume = parseFloat($("vol").value);
    audio = a;
    const onReady = () => {
      $("pPath").textContent = (c || "") + "  ·  " + path;
      $("tTot").textContent = fmt(a.duration);
    };
    a.addEventListener("loadedmetadata", onReady);
    a.addEventListener("canplay", onReady);
    a.addEventListener("waiting", () => {
      if ($("pPath").textContent.indexOf("LOADING") === -1)
        $("pPath").textContent = "BUFFERING  ·  " + path;
    });
    a.addEventListener("playing", () => {
      $("pPath").textContent = (c || "") + "  ·  " + path;
      $("pPauseSvg").innerHTML = "<path d=\"M6 5h4v14H6zm8 0h4v14h-4z\"/>";
    });
    a.addEventListener("ended", () => {
      if (el) el.classList.remove("playing");
      a.currentTime = 0;
      $("fill").style.width = "0%";
      $("tCur").textContent = "0:00";
      $("pPauseSvg").innerHTML = "<path d=\"M8 5v14l11-7z\"/>";
      cancelAnimationFrame(raf);
    });
    a.addEventListener("error", () => {
      if (tries < 1 && !fromBlob) {
        tries++;
        loadViaBlob();
        return;
      }
      $("pPath").textContent = "FAILED  ·  " + path;
      $("tTot").textContent = "0:00";
      if (el) el.classList.remove("playing");
    });
    const p = a.play();
    if (p && p.catch) p.catch(function () {
      $("pPath").textContent = "TAP PLAY  ·  " + path;
      $("pPauseSvg").innerHTML = "<path d=\"M8 5v14l11-7z\"/>";
    });
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }

  function loadDirect() {
    const a = new Audio();
    a.crossOrigin = "anonymous";
    a.src = url;
    bindAudio(a, false);
  }

  function loadViaBlob() {
    $("pPath").textContent = "RETRY  ·  " + path;
    fetch(url, { cache: "force-cache" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.blob();
      })
      .then(function (blob) {
        const a = new Audio();
        a.src = URL.createObjectURL(blob);
        bindAudio(a, true);
      })
      .catch(function (e) {
        $("pPath").textContent = "FAILED  ·  " + (e.message || path);
        $("tTot").textContent = "0:00";
        if (el) el.classList.remove("playing");
      });
  }

  loadDirect();
}

function stop(hide) {
  if (hide === undefined) hide = false;
  if (audio) {
    try { audio.pause(); audio.currentTime = 0; } catch (e) {}
  }
  if (cardEl) cardEl.classList.remove("playing");
  cardEl = null; cancelAnimationFrame(raf);
  $("fill").style.width = "0%";
  $("tCur").textContent = "0:00";
  $("pPauseSvg").innerHTML = "<path d=\"M8 5v14l11-7z\"/>";
  if (hide) {
    if (audio) { audio.src = ""; audio = null; }
    $("player").classList.remove("show");
  }
}

function togglePause() {
  if (!audio) return;
  if (audio.paused) {
    if (audio.ended || (audio.duration && audio.currentTime >= audio.duration - 0.05)) {
      audio.currentTime = 0;
    }
    audio.play();
    $("pPauseSvg").innerHTML = "<path d=\"M6 5h4v14H6zm8 0h4v14h-4z\"/>";
    raf = requestAnimationFrame(tick);
  } else {
    audio.pause();
    $("pPauseSvg").innerHTML = "<path d=\"M8 5v14l11-7z\"/>";
    cancelAnimationFrame(raf);
  }
}

function seek(e) {
  if (!audio || !audio.duration) return;
  const r = $("track").getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  audio.currentTime = ratio * audio.duration;
  $("fill").style.width = (ratio * 100) + "%";
  $("tCur").textContent = fmt(audio.currentTime);
}

function applySearch(q) {
  $("search").value = q;
  cat = "all";
  $("nav").querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.c === "all"));
  render("all", q);
}

function appendBubble(role, html) {
  const d = document.createElement("div");
  d.className = "bubble " + role;
  d.innerHTML = html;
  $("chatLog").appendChild(d);
  $("chatLog").scrollTop = $("chatLog").scrollHeight;
  return d;
}

function parseAI(text) {
  let search = null, plays = [];
  const clean = [];
  text.split("\n").forEach(line => {
    const s = line.match(/^SEARCH:\s*(.+)$/i);
    const p = line.match(/^PLAY:\s*(.+)$/i);
    if (s) { search = s[1].trim(); return; }
    if (p) {
      p[1].split(",").map(x => x.trim()).filter(Boolean).forEach(path => {
        let pp = path.replace(/^sounds\//, "").replace(/^\//, "");
        if (!pp.endsWith(".ogg")) {
          const hit = all.find(x => x.path.includes(pp) || x.path.endsWith(pp + ".ogg"));
          if (hit) pp = hit.path;
        }
        if (all.some(x => x.path === pp)) plays.push(pp);
      });
      return;
    }
    clean.push(line);
  });
  return { text: clean.join("\n").trim(), search: search, plays: plays };
}

async function sendChat() {
  const key = $("groqKey").value.trim();
  const model = $("groqModel").value;
  const msg = $("chatInput").value.trim();
  if (!msg) return;
  if (!key) { appendBubble("sys", "Groq API key kerak"); return; }
  localStorage.setItem("groq_api_key", key);
  localStorage.setItem("groq_model", model);
  $("chatInput").value = "";
  appendBubble("user", esc(msg));
  const wait = appendBubble("sys", "...");
  $("chatSend").disabled = true;

  const matches = searchLib(msg, 35);
  const matchList = matches.map(m => m.path).join("\n");
  const system = "Sen Minecraft Soundboard yordamchisisan. 4961 ta .ogg bor.\n" +
    "1) SEARCH: qatorida search sozini ber.\n" +
    "2) PLAY: qatorida aniq pathlarni vergul bilan ber.\n" +
    "3) Qisqa ozbekcha javob yoz.\n" +
    "Format:\nmatn\nSEARCH: soz\nPLAY: path1.ogg, path2.ogg\n\n" +
    "Kategoriyalar: " + data.categories.join(", ") + "\n\nMos ovozlar:\n" +
    (matchList || "(topilmadi)") + "\n\nPLAY da faqat shu royxatdan tanla. 1-5 ta.";

  hist.push({ role: "user", content: msg });
  if (hist.length > 12) hist = hist.slice(-12);

  try {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({ model: model, temperature: 0.3, max_tokens: 600,
        messages: [{ role: "system", content: system }].concat(hist) })
    });
    const json = await res.json();
    wait.remove();
    if (!res.ok) {
      appendBubble("sys", "Error: " + (json.error && json.error.message ? json.error.message : res.status));
      $("chatSend").disabled = false; return;
    }
    const raw = (json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content) || "";
    hist.push({ role: "assistant", content: raw });
    const parsed = parseAI(raw);
    let html = esc(parsed.text || raw).replace(/\n/g, "<br>");
    if (parsed.search) {
      html += "<div class=\"hint\" data-q=\"" + esc(parsed.search) + "\">SEARCH: <b>" + esc(parsed.search) + "</b></div>";
    }
    if (parsed.plays.length) {
      html += "<div class=\"chips\">";
      parsed.plays.forEach(p => {
        html += "<span class=\"chip\" data-path=\"" + esc(p) + "\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"/></svg>" +
          esc(p.split("/").pop()) + "</span>";
      });
      html += "</div>";
    }
    const el = appendBubble("ai", html);
    el.querySelectorAll(".hint").forEach(h => h.addEventListener("click", () => applySearch(h.dataset.q)));
    el.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
      const path = c.dataset.path;
      const meta = all.find(x => x.path === path);
      play(path, meta ? meta.cat : "", null);
      applySearch(parsed.search || path.split("/").pop().replace(".ogg", ""));
    }));
    if (parsed.plays.length) {
      const path = parsed.plays[0];
      const meta = all.find(x => x.path === path);
      play(path, meta ? meta.cat : "", null);
      if (parsed.search) applySearch(parsed.search);
    } else if (parsed.search) applySearch(parsed.search);
  } catch (e) {
    wait.remove();
    appendBubble("sys", "Network: " + e.message);
  }
  $("chatSend").disabled = false;
}

function bind() {
  let t;
  $("search").addEventListener("input", e => {
    clearTimeout(t);
    t = setTimeout(() => render(cat, e.target.value.trim()), 150);
  });
  $("btnRand").addEventListener("click", () => {
    const list = filterList(cat, $("search").value.trim());
    if (!list.length) return;
    const item = list[Math.floor(Math.random() * list.length)];
    play(item.path, item.cat, null);
  });
  $("btnStop").addEventListener("click", () => stop(false));
  $("pStop").addEventListener("click", () => stop(false));
  $("pPause").addEventListener("click", togglePause);
  $("vol").addEventListener("input", e => { if (audio) audio.volume = parseFloat(e.target.value); });
  $("track").addEventListener("click", seek);
  $("track").addEventListener("mousedown", e => {
    seeking = true; seek(e);
    const mv = ev => seek(ev);
    const up = () => { seeking = false; document.removeEventListener("mousemove", mv); document.removeEventListener("mouseup", up); };
    document.addEventListener("mousemove", mv);
    document.addEventListener("mouseup", up);
  });
  $("btnTheme").addEventListener("click", () => {
    const cur = document.body.getAttribute("data-theme") === "light" ? "dark" : "light";
    setTheme(cur);
  });
  $("btnNav").addEventListener("click", () => $("nav").classList.toggle("open"));
  const toggleChat = () => {
    $("shell").classList.toggle("chat-on");
    $("btnChat").classList.toggle("on", $("shell").classList.contains("chat-on"));
  };
  $("btnChat").addEventListener("click", toggleChat);
  $("chatClose").addEventListener("click", toggleChat);
  $("backdrop").addEventListener("click", toggleChat);
  $("chatSend").addEventListener("click", sendChat);
  // persist key/model immediately
  const saveKey = () => {
    const k = $("groqKey").value.trim();
    if (k) localStorage.setItem("groq_api_key", k);
  };
  const saveModel = () => localStorage.setItem("groq_model", $("groqModel").value);
  $("groqKey").addEventListener("input", saveKey);
  $("groqKey").addEventListener("change", saveKey);
  $("groqKey").addEventListener("blur", saveKey);
  $("groqModel").addEventListener("change", saveModel);
  $("chatInput").addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });
}

init();
</script>
