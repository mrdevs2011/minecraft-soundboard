<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MCSND — Minecraft Sound Archive</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#050505">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#050505; --bg2:#0a0a0a; --surface:#111; --surface2:#181818;
  --border:#2a2a2a; --border2:#3a3a3a; --text:#f5f5f5; --muted:#c0c0c0; --dim:#9a9a9a;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
[data-theme="light"] {
  --bg:#f3f3f3; --bg2:#eaeaea; --surface:#fff; --surface2:#f6f6f6;
  --border:#d0d0d0; --border2:#bbb; --text:#0a0a0a; --muted:#666; --dim:#999;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Syne,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
button{color:inherit;font:inherit}

body::before{content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

.top{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 clamp(12px,3vw,24px)}
.top-inner{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;min-height:54px;max-width:1600px;margin:0 auto}
@media(max-width:720px){.top-inner{grid-template-columns:auto 1fr;gap:8px;padding:8px 0}.top-actions{grid-column:1/-1;justify-content:flex-end}}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none}
.brand-mark{width:26px;height:26px;border:1.5px solid var(--text);display:grid;place-items:center;border-radius:8px}
.brand-mark svg{width:13px;height:13px}
.brand-text{font-weight:800;font-size:14px;letter-spacing:.14em}
.brand-text span{color:var(--muted);font-weight:500}
.search-wrap{position:relative;max-width:420px;width:100%;justify-self:center}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;opacity:.4;pointer-events:none}
.search-wrap input{width:100%;height:38px;padding:0 12px 0 36px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:"IBM Plex Mono",monospace;font-size:12px;outline:none;border-radius:12px}
.search-wrap input:focus{border-color:var(--text)}
.top-actions{display:flex;align-items:center;gap:6px}
.icon-btn{height:34px;min-width:34px;padding:0 9px;background:transparent;border:1px solid var(--border);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;transition:.15s;border-radius:10px}
.icon-btn svg{width:14px;height:14px}
.icon-btn:hover,.icon-btn.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.meta-count{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);letter-spacing:.06em}

.shell{display:grid;grid-template-columns:240px minmax(0,1fr);max-width:1600px;margin:0 auto;min-height:calc(100dvh - 54px)}
.shell.chat-on{grid-template-columns:240px minmax(0,1fr) minmax(280px,340px)}
@media(max-width:1100px){
  .shell,.shell.chat-on{grid-template-columns:200px minmax(0,1fr)}
  .chat{position:fixed;right:0;top:54px;bottom:0;width:min(340px,100vw);z-index:80;transform:translateX(100%);transition:transform .25s ease;border-left:1px solid var(--border)}
  .shell.chat-on .chat{transform:translateX(0)}
}
@media(max-width:720px){
  .shell,.shell.chat-on{grid-template-columns:1fr}
  .nav{display:none}
  .nav.open{display:flex;flex-direction:column;position:fixed;inset:54px 0 0 0;z-index:70;background:var(--bg);overflow:auto}
}

.nav{border-right:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;max-height:calc(100dvh - 54px);position:sticky;top:54px}
.nav-head{padding:12px 12px 8px;border-bottom:1px solid var(--border)}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text)}
.crumb button{background:none;border:none;color:var(--muted);cursor:pointer;font:inherit;padding:2px 4px}
.crumb button:hover,.crumb button.active{color:var(--text)}
.crumb .sep{opacity:.4}
.nav-list{flex:1;overflow-y:auto;padding:8px}
.folder,.file-row{
  width:100%;display:flex;align-items:center;gap:8px;padding:9px 10px;margin-bottom:2px;
  border:1px solid transparent;background:transparent;color:var(--text);
  font-family:"IBM Plex Mono",monospace;font-size:11px;cursor:pointer;text-align:left;transition:.12s;border-radius:10px
}
.folder:hover,.file-row:hover{color:var(--text);border-color:var(--border);background:var(--surface)}
.folder.active{color:var(--bg);background:var(--text);border-color:var(--text)}
.folder svg,.file-row svg{width:13px;height:13px;flex-shrink:0;opacity:.7}
.folder .n{margin-left:auto;font-size:9px;opacity:.65;border:1px solid currentColor;padding:1px 5px;border-radius:6px}

.stage{padding:clamp(12px,2vw,22px);overflow-y:auto;padding-bottom:130px}
.stage-title{font-size:11px;font-family:"IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}

.player{
  display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));z-index:200;
  border:1px solid var(--border);background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(18px);box-shadow:0 16px 48px rgba(0,0,0,.5);max-width:640px;margin:0 auto;
  transition:left .25s,right .25s,max-width .25s;border-radius:16px
}
.player.show{display:block}
@media(min-width:900px){.player{left:50%;right:auto;transform:translateX(-50%);width:min(640px,calc(100vw - 24px))}}
.shell.chat-on .player{left:12px;right:calc(12px + min(340px,100vw) + 8px);transform:none;width:auto;max-width:520px;margin:0}
@media(max-width:1100px){.shell.chat-on .player{left:12px;right:12px;max-width:none}}
.player-inner{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.player-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.player-ico{width:38px;height:38px;border:1px solid var(--text);display:grid;place-items:center;flex-shrink:0;background:var(--text);color:var(--bg);position:relative;border-radius:12px;cursor:pointer}
.player-ico svg{width:14px;height:14px}
.spin-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--text);color:var(--bg)}
.spin-wrap.hidden{display:none}
.spin-ring{width:20px;height:20px;border:2px solid color-mix(in srgb,var(--bg) 25%,transparent);border-top-color:var(--bg);border-radius:50%;animation:spin .7s linear infinite;position:absolute}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-pct{font-family:"IBM Plex Mono",monospace;font-size:8px;font-weight:600;position:relative;z-index:1}
.player-meta{flex:1;min-width:0}
.player-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-path{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.player-ctrls{display:flex;gap:6px;align-items:center}
.vol{width:70px;accent-color:var(--text);height:3px}
.prog{display:grid;grid-template-columns:38px 1fr 38px;gap:8px;align-items:center}
.prog time{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted)}
.prog time:last-child{text-align:right}
.track{height:3px;background:var(--border);cursor:pointer;position:relative;border-radius:4px;overflow:hidden}
.track:hover{height:5px}
.fill{height:100%;width:0%;background:var(--text);position:relative}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:8px}
.card{
  position:relative;background:var(--surface);border:1px solid var(--border);padding:11px 13px;
  display:flex;align-items:center;gap:11px;cursor:pointer;transition:.15s;user-select:none;border-radius:14px
}
.card:hover{border-color:var(--text);background:var(--surface2);transform:translateY(-2px)}
.card.playing{border-color:var(--text);background:var(--text);color:var(--bg)}
.card.playing .card-path,.card.playing .card-meta{color:color-mix(in srgb,var(--bg) 55%,transparent)}
.card-play{width:32px;height:32px;border:1px solid var(--border2);display:grid;place-items:center;flex-shrink:0;border-radius:10px}
.card-play svg{width:11px;height:11px}
.card:hover .card-play,.card.playing .card-play{border-color:var(--text);background:var(--text);color:var(--bg)}
.card.playing .card-play{background:var(--bg);color:var(--text);border-color:var(--bg)}
.card-body{min-width:0;flex:1}
.card-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-path{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.card-meta{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--dim);margin-top:3px}

.folder-grid{display:none}
.folder-card{
  border:1px solid var(--border);background:var(--surface);padding:16px 14px;cursor:pointer;transition:.15s;
  display:flex;flex-direction:column;gap:8px;min-height:88px;color:var(--text)
}
.folder-card:hover{border-color:var(--text);background:var(--surface2);transform:translateY(-2px)}
.folder-card svg{width:18px;height:18px;color:var(--text);opacity:1}
.folder-card .fn{font-weight:700;font-size:13px;letter-spacing:.02em;color:var(--text)}
.folder-card .fc{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted)}

.empty{text-align:center;padding:48px 16px;color:var(--muted);grid-column:1/-1}
.empty h2{font-size:16px;color:var(--text);margin-bottom:6px;font-weight:700}
.load{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:36vh;gap:12px}
.load-bar{width:min(260px,70vw);height:2px;background:var(--border);overflow:hidden}
.load-fill{height:100%;width:0%;background:var(--text);transition:width .3s}
.load-txt{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);letter-spacing:.1em}

.chat{display:none;flex-direction:column;background:var(--bg2);border-left:1px solid var(--border);max-height:calc(100dvh - 54px);position:sticky;top:54px}
.shell.chat-on .chat{display:flex}
.chat-hd{padding:11px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.chat-hd h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:7px}
.chat-hd h3 svg{width:13px;height:13px}
.chat-hd-actions{display:flex;gap:4px}
.key-pop{display:none;padding:10px 12px;border-bottom:1px solid var(--border);gap:8px;flex-direction:column}
.key-pop.open{display:flex}
.key-pop label{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.key-pop input{height:36px;padding:0 10px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:"IBM Plex Mono",monospace;font-size:12px;outline:none;border-radius:10px}
.key-pop input:focus{border-color:var(--text)}
.chat-log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:70%;padding:10px 12px;font-size:13px;line-height:1.45;border:1px solid var(--border);word-break:break-word;border-radius:14px}
.bubble.has-cards{max-width:100%;width:100%;align-self:stretch;box-sizing:border-box}
.bubble.has-cards .chips{width:100%}
.bubble.has-cards .chip{width:100%;box-sizing:border-box}
.bubble.user{align-self:flex-end;background:var(--text);color:var(--bg);border-color:var(--text)}
.bubble.ai{align-self:flex-start;background:var(--surface)}
.bubble.sys{align-self:center;border:none;background:transparent;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:11px}
.chips{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border2);background:var(--surface);cursor:pointer;text-align:left;transition:.15s;border-radius:12px}
.chip:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip-ico{width:28px;height:28px;border:1px solid currentColor;display:grid;place-items:center;flex-shrink:0;border-radius:8px}
.chip-ico svg{width:10px;height:10px}
.chip-body{min-width:0;flex:1}
.chip-name{font-weight:600;font-size:12px}
.chip-path{font-family:"IBM Plex Mono",monospace;font-size:9px;opacity:.65;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-meta{font-family:"IBM Plex Mono",monospace;font-size:9px;opacity:.5;margin-top:2px}
.chat-in{padding:10px 12px calc(10px + var(--safe-b));border-top:1px solid var(--border);display:flex;gap:8px}
.chat-in input{flex:1;height:40px;padding:0 12px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:"IBM Plex Mono",monospace;font-size:13px;outline:none;border-radius:12px}
.chat-in input:focus{border-color:var(--text)}
.chat-in button{height:40px;padding:0 14px;background:var(--text);color:var(--bg);border:1px solid var(--text);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:12px}
.chat-in button:disabled{opacity:.4;cursor:not-allowed}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:75}
.shell.chat-on .backdrop{display:block}
@media(min-width:1101px){.backdrop{display:none!important}}
.chat-hd .icon-btn.hidden{display:none}
</style>
</head>
<body data-theme="dark">
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#" id="brandHome">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h3l2-7 4 14 2-7h5"/></svg></div>
      <div class="brand-text">MC<span>SND</span></div>
    </a>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
      <input type="search" id="search" placeholder="Global search..." autocomplete="off">
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnNav" type="button" title="Folders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h7l2 2h9v10H3z"/></svg>
      </button>
      <button class="icon-btn" id="btnTheme" type="button" title="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="btnChat" type="button" title="AI">

</header>

<div class="backdrop" id="backdrop"></div>
<div class="shell" id="shell">
  <nav class="nav" id="nav">

  <main class="stage">

        <div class="load-bar"><div class="load-fill" id="loadFill"></div></div>

  <aside class="chat" id="chat">
    <div class="chat-hd">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16v10H8l-4 4V6z"/></svg> GROQ AI</h3>
      <div class="chat-hd-actions">
        <button class="icon-btn hidden" id="btnClear" type="button" title="Clear chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5h6v2M6 7l1 12h10l1-12"/></svg>
        </button>
        <button class="icon-btn" id="btnKey" type="button" title="API Key">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="12" r="3"/><path d="M11 12h9M17 9v6M20 10v4"/></svg>
        </button>
        <button class="icon-btn" id="chatClose" type="button" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>

    </div>

<div class="player" id="player">
  <div class="player-inner">
    <div class="player-row">

        <div class="spin-wrap hidden" id="pSpin"><div class="spin-ring"></div><span class="spin-pct" id="pPct">0%</span></div>
      </div>
      <div class="player-meta">
        <div class="player-name" id="pName">—</div>
        <div class="player-path" id="pPath">—</div>
      </div>

      </div>

      <time id="tCur">0:00</time>
      <div class="track" id="track"><div class="fill" id="fill"></div></div>
      <time id="tTot">0:00</time>
    </div>
  </div>
</div>

<script>
const BASE = "sounds/";
const MODEL = "openai/gpt-oss-120b";
let data = null, all = [], tree = {}, navPath = [];
let audio = null, cardEl = null, seeking = false, raf = null, hist = [];
let chatUIHist = []; // {role, html} persisted
let chatLoaded = 0;

const $ = id => document.getElementById(id);

function fmt(s) {
  if (!isFinite(s) || s < 0) return "0:00";
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m + ":" + String(sec).padStart(2, "0");
}
function fmtSize(b) {
  if (b == null || !isFinite(b)) return "—";
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
  return (b / 1048576).toFixed(2) + " MB";
}
function fmtDur(s) {
  if (s == null || !isFinite(s) || s < 0) return "—";
  if (s < 60) return s.toFixed(1) + "s";
  return fmt(s);
}
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML.replace(/"/g, "&" + "quot;");
}
function getMeta(path) {
  return (data && data.meta && data.meta[path]) || { size: null, dur: null };
}
function setSpin(on, pct) {
  const w = $("pSpin"), svg = $("pIcoSvg");
  if (!w) return;
  if (on) {
    w.classList.remove("hidden");
    if (svg) svg.style.opacity = "0";
    $("pPct").textContent = (pct != null ? Math.round(Math.max(0, Math.min(100, pct))) : 0) + "%";
  } else {
    w.classList.add("hidden");
    if (svg) svg.style.opacity = "1";
  }
}

function buildTree(paths) {
  const root = { folders: {}, files: [] };
  for (const path of paths) {
    const parts = path.split("/");
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      const seg = parts[i];
      if (!node.folders[seg]) node.folders[seg] = { folders: {}, files: [] };
      node = node.folders[seg];
    }
    node.files.push(path);
  }
  return root;
}

function nodeAt(pathArr) {
  let node = tree;
  for (const seg of pathArr) {
    if (!node.folders[seg]) return { folders: {}, files: [] };
    node = node.folders[seg];
  }
  return node;
}

function countFiles(node) {
  let n = node.files.length;
  for (const k of Object.keys(node.folders)) n += countFiles(node.folders[k]);
  return n;
}

async function init() {
  try {
    $("loadFill").style.width = "30%";
    const res = await fetch("sounds.json");
    $("loadFill").style.width = "70%";
    data = await res.json();
    all = [];
    for (const c of data.categories) for (const p of (data.sounds[c] || [])) all.push({ path: p, cat: c });
    tree = buildTree(all.map(x => x.path));
    $("stats").textContent = data.total.toLocaleString() + " FILES";
    $("loadFill").style.width = "100%";
    const k = localStorage.getItem("groq_api_key");
    if (k) $("groqKey").value = k;
    const th = localStorage.getItem("mcsnd_theme");
    if (th === "light") document.body.setAttribute("data-theme", "light");
    bind();
    loadChatFromStorage();
    goNav([]);
  } catch (e) {
    $("grid").innerHTML = "<div class=\"empty\"><h2>LOAD FAILED</h2><p>" + esc(e.message) + "</p></div>";
  }
}

function goNav(pathArr) {
  navPath = pathArr.slice();
  $("search").value = "";
  renderNav();
  renderStage();
  $("nav").classList.remove("open");
}

function renderNav() {
  const crumb = $("crumb");
  let ch = "<button type=\"button\" data-i=\"-1\">root</button>";
  navPath.forEach((seg, i) => {
    ch += "<span class=\"sep\">/</span><button type=\"button\" data-i=\"" + i + "\">" + esc(seg) + "</button>";
  });
  crumb.innerHTML = ch;
  crumb.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.i);
      goNav(i < 0 ? [] : navPath.slice(0, i + 1));
    });
  });

  const node = nodeAt(navPath);
  const folders = Object.keys(node.folders).sort();
  let h = "";
  folders.forEach(name => {
    const sub = node.folders[name];
    const n = countFiles(sub);
    h += "<button class=\"folder\" type=\"button\" data-folder=\"" + esc(name) + "\">" +
      "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 7h7l2 2h9v10H3z\"/></svg>" +
      "<span>" + esc(name) + "</span><span class=\"n\">" + n + "</span></button>";
  });
  $("navList").innerHTML = h || "<div style=\"padding:12px;color:var(--dim);font-size:11px;font-family:IBM Plex Mono,monospace\">No subfolders</div>";
  $("navList").querySelectorAll(".folder").forEach(btn => {
    btn.addEventListener("click", () => goNav(navPath.concat([btn.dataset.folder])));
  });
}

function renderStage(query) {
  query = (query || "").trim().toLowerCase();
  const folderGrid = $("folderGrid");
  const grid = $("grid");

  if (query) {
    $("stageTitle").textContent = "SEARCH · " + query;
    folderGrid.innerHTML = "";
    const list = all.filter(s => s.path.toLowerCase().includes(query));
    renderCards(list.slice(0, 400), list.length);
    return;
  }

  const node = nodeAt(navPath);
  const folders = Object.keys(node.folders).sort();
  $("stageTitle").textContent = navPath.length ? navPath.join(" / ") : "ROOT";

  let fh = "";
  folders.forEach(name => {
    const n = countFiles(node.folders[name]);
    fh += "<button class=\"folder-card\" type=\"button\" data-folder=\"" + esc(name) + "\">" +
      "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M3 7h7l2 2h9v10H3z\"/></svg>" +
      "<div class=\"fn\">" + esc(name) + "</div><div class=\"fc\">" + n + " sounds</div></button>";
  });
  folderGrid.innerHTML = fh;
  folderGrid.querySelectorAll(".folder-card").forEach(btn => {
    btn.addEventListener("click", () => goNav(navPath.concat([btn.dataset.folder])));
  });

  const files = node.files.map(p => ({ path: p, cat: p.split("/")[0] }));
  renderCards(files, files.length);
}

function renderCards(list, total) {
  const grid = $("grid");
  if (!list.length) {
    grid.innerHTML = "<div class=\"empty\"><h2>EMPTY</h2><p>Bu papkada fayl yo‘q — pastdagi yoki yon papkalarni oching</p></div>";
    return;
  }
  let h = "";
  for (const s of list) {
    const name = s.path.split("/").pop().replace(/\.ogg$/i, "");
    const mt = getMeta(s.path);
    h += "<div class=\"card\" data-path=\"" + esc(s.path) + "\" data-cat=\"" + esc(s.cat) + "\">" +
      "<div class=\"card-play\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"/></svg></div>" +
      "<div class=\"card-body\"><div class=\"card-name\">" + esc(name) + "</div>" +
      "<div class=\"card-path\">" + esc(s.path) + "</div>" +
      "<div class=\"card-meta\">" + fmtDur(mt.dur) + "  ·  " + fmtSize(mt.size) + "</div></div></div>";
  }
  if (total > list.length) h += "<div class=\"empty\"><p>Showing " + list.length + " / " + total + "</p></div>";
  grid.innerHTML = h;
  grid.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => play(el.dataset.path, el.dataset.cat, el));
  });
}

function tick() {
  if (!audio || seeking) return;
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  $("fill").style.width = pct + "%";
  $("tCur").textContent = fmt(audio.currentTime);
  $("tTot").textContent = fmt(audio.duration);
  raf = requestAnimationFrame(tick);
}

function play(path, c, el) {
  stop(false);
  if (cardEl) cardEl.classList.remove("playing");
  cardEl = el || null;
  if (el) el.classList.add("playing");
  const mt = getMeta(path);
  const sizeStr = fmtSize(mt.size);
  $("player").classList.add("show");
  $("pName").textContent = path.split("/").pop();
  $("pPath").textContent = "LOADING · " + sizeStr + " · " + path;
  $("fill").style.width = "0%";
  $("tCur").textContent = "0:00";
  $("tTot").textContent = mt.dur != null ? fmt(mt.dur) : "...";
  $("pIcoSvg").innerHTML = "<path d=\"M6 5h4v14H6zm8 0h4v14h-4z\"/>";
  setSpin(true, 0);

  const url = BASE + path.split("/").map(encodeURIComponent).join("/");
  const knownSize = mt.size || 0;
  const useProgress = knownSize > 50000 || (mt.dur != null && mt.dur > 3);

  function start(src, revoke) {
    const a = new Audio();
    a.preload = "auto";
    a.volume = parseFloat($("vol").value);
    a.src = src;
    audio = a;
    a.addEventListener("loadedmetadata", () => {
      setSpin(false, 100);
      $("tTot").textContent = fmt(a.duration);
      $("pPath").textContent = (c || "") + " · " + fmtDur(a.duration) + " · " + sizeStr + " · " + path;
    });
    a.addEventListener("canplay", () => setSpin(false, 100));
    a.addEventListener("waiting", () => setSpin(true, null));
    a.addEventListener("playing", () => {
      setSpin(false, 100);
      $("pIcoSvg").innerHTML = "<path d=\"M6 5h4v14H6zm8 0h4v14h-4z\"/>";
    });
    a.addEventListener("ended", () => {
      if (el) el.classList.remove("playing");
      a.currentTime = 0;
      $("fill").style.width = "0%";
      $("tCur").textContent = "0:00";
      $("pIcoSvg").innerHTML = "<path d=\"M8 5v14l11-7z\"/>";
      cancelAnimationFrame(raf);
      setSpin(false, 0);
    });
    a.addEventListener("error", () => {
      setSpin(false, 0);
      $("pPath").textContent = "FAILED · " + path;
      if (el) el.classList.remove("playing");
    });
    const p = a.play();
    if (p && p.catch) p.catch(() => {
      setSpin(false, 0);
      $("pIcoSvg").innerHTML = "<path d=\"M8 5v14l11-7z\"/>";
    });
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }

  if (!useProgress) { start(url, false); return; }

  fetch(url, { cache: "force-cache" }).then(async res => {
    if (!res.ok) throw new Error("HTTP " + res.status);
    const total = Number(res.headers.get("content-length")) || knownSize || 0;
    if (!res.body || !res.body.getReader) {
      start(URL.createObjectURL(await res.blob()), true);
      return;
    }
    const reader = res.body.getReader();
    const chunks = [];
    let received = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      const pct = total ? (received / total) * 100 : Math.min(95, received / 5000);
      setSpin(true, pct);
      $("pPath").textContent = "LOADING " + Math.round(pct) + "% · " + sizeStr + " · " + path;
    }
    setSpin(true, 100);
    start(URL.createObjectURL(new Blob(chunks, { type: "audio/ogg" })), true);
  }).catch(() => start(url, false));
}

function stop(hide) {
  if (hide === undefined) hide = false;
  setSpin(false, 0);
  if (audio) {
    try { audio.pause(); audio.currentTime = 0; audio.src = ""; audio.load(); } catch (e) {}
    audio = null;
  }
  if (cardEl) cardEl.classList.remove("playing");
  cardEl = null;
  cancelAnimationFrame(raf);
  $("fill").style.width = "0%";
  $("tCur").textContent = "0:00";
  const ico = $("pIcoSvg");
  if (ico) ico.innerHTML = "<path d=\"M8 5v14l11-7z\"/>";
  if (hide) $("player").classList.remove("show");
}

function togglePause() {
  if (!audio) return;
  if (audio.paused) {
    if (audio.ended || (audio.duration && audio.currentTime >= audio.duration - 0.05)) audio.currentTime = 0;
    audio.play();
    $("pIcoSvg").innerHTML = "<path d=\"M6 5h4v14H6zm8 0h4v14h-4z\"/>";
    raf = requestAnimationFrame(tick);
  } else {
    audio.pause();
    $("pIcoSvg").innerHTML = "<path d=\"M8 5v14l11-7z\"/>";
    cancelAnimationFrame(raf);
  }
}

function seek(e) {
  if (!audio || !audio.duration) return;
  const r = $("track").getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  audio.currentTime = ratio * audio.duration;
  $("fill").style.width = (ratio * 100) + "%";
  $("tCur").textContent = fmt(audio.currentTime);
}

function searchLib(query, limit) {
  limit = limit || 50;
  const aliases = {
    mol:"cow", sigir:"cow", cow:"cow", moo:"say", muu:"say", maarashi:"say", marashi:"say",
    sut:"milk", milk:"milk", tovuq:"chicken", chicken:"chicken", chochqa:"pig", pig:"pig",
    qoy:"sheep", sheep:"sheep", ot:"horse", horse:"horse", it:"wolf", wolf:"wolf",
    mushuk:"cat", cat:"cat", zombi:"zombie", zombie:"zombie", skelet:"skeleton",
    kriper:"creeper", creeper:"creeper", orgimchak:"spider", spider:"spider",
    musiqa:"music", qoshiq:"music", song:"music", music:"music", yomgir:"rain", eshik:"door", suv:"water", otash:"fire",
    qilich:"sword", yurish:"step", olim:"death", zarar:"hurt"
  };
  const q = query.toLowerCase();
  const tokens = q.split(/[^a-zA-Z0-9_\u0400-\u04FF]+/).filter(t => t.length > 1);
  const terms = new Set();
  tokens.forEach(t => { terms.add(t); if (aliases[t]) terms.add(aliases[t]); });
  if (!terms.size) terms.add(q);
  const scored = [];
  for (const s of all) {
    const p = s.path.toLowerCase();
    let score = 0;
    for (const t of terms) if (p.includes(t)) score += t.length + (p.split("/").pop().includes(t) ? 5 : 0);
    if (q.includes("qoshiq") || q.includes("musiqa") || q.includes("song") || q.includes("music")) {
      if (p.startsWith("music/")) score += 40;
      if (p.startsWith("note/")) score += 15;
    }
    if (score) scored.push(Object.assign({}, s, { score }));
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, limit);
}


function saveChatUI() {
  try { localStorage.setItem("mcsnd_chat_ui", JSON.stringify(chatUIHist)); } catch (e) {}
}
function updateClearBtn() {
  const btn = $("btnClear");
  if (!btn) return;
  const has = chatUIHist.some(x => x.role === "user");
  btn.classList.toggle("hidden", !has);
}
function renderChatSlice(from, to) {
  const log = $("chatLog");
  const slice = chatUIHist.slice(from, to);
  const frag = document.createDocumentFragment();
  slice.forEach(item => {
    const d = document.createElement("div");
    d.className = "bubble " + item.role + (item.hasCards ? " has-cards" : "");
    d.innerHTML = item.html;
    if (item.hasCards) {
      d.querySelectorAll(".chip").forEach(c => {
        c.addEventListener("click", () => {
          const path = c.dataset.path;
          const meta = all.find(x => x.path === path);
          play(path, meta ? meta.cat : "", null);
        });
      });
    }
    frag.appendChild(d);
  });
  return frag;
}
function loadChatFromStorage() {
  try {
    chatUIHist = JSON.parse(localStorage.getItem("mcsnd_chat_ui") || "[]");
    if (!Array.isArray(chatUIHist)) chatUIHist = [];
  } catch (e) { chatUIHist = []; }
  const log = $("chatLog");
  log.innerHTML = "";
  if (!chatUIHist.length) {
    log.innerHTML = "<div class=\"bubble sys\">Kalit ikonka orqali API key → so‘rang</div>";
    updateClearBtn();
    return;
  }
  // load last 20 bubbles (~10 turns)
  const start = Math.max(0, chatUIHist.length - 20);
  chatLoaded = start;
  log.appendChild(renderChatSlice(start, chatUIHist.length));
  log.scrollTop = log.scrollHeight;
  updateClearBtn();
}
function clearChat() {
  chatUIHist = [];
  hist = [];
  chatLoaded = 0;
  saveChatUI();
  $("chatLog").innerHTML = "<div class=\"bubble sys\">Chat tozalandi</div>";
  updateClearBtn();
}
function appendBubble(role, html, hasCards) {
  hasCards = !!hasCards;
  const d = document.createElement("div");
  d.className = "bubble " + role + (hasCards ? " has-cards" : "");
  d.innerHTML = html;
  $("chatLog").appendChild(d);
  $("chatLog").scrollTop = $("chatLog").scrollHeight;
  if (role !== "sys" || html.indexOf("...") === -1) {
    if (!(role === "sys" && (html === "..." || html.indexOf("Network:") === 0 || html.indexOf("Error:") === 0 || html.indexOf("Yuqori") === 0))) {
      if (role === "user" || role === "ai") {
        chatUIHist.push({ role: role, html: html, hasCards: hasCards });
        saveChatUI();
        updateClearBtn();
      }
    }
  }
  return d;
}

function parseAI(text) {
  let plays = [];
  const clean = [];
  text.split("\n").forEach(line => {
    const p = line.match(/^PLAY:\s*(.+)$/i);
    if (p) {
      p[1].split(",").map(x => x.trim()).filter(Boolean).forEach(path => {
        let pp = path.replace(/^sounds\//, "").replace(/^\//, "");
        if (!pp.endsWith(".ogg")) {
          const hit = all.find(x => x.path.includes(pp) || x.path.endsWith(pp + ".ogg"));
          if (hit) pp = hit.path;
        }
        if (all.some(x => x.path === pp) && !plays.includes(pp)) plays.push(pp);
      });
      return;
    }
    if (/^SEARCH:/i.test(line)) return;
    clean.push(line);
  });
  return { text: clean.join("\n").trim(), plays };
}

async function sendChat() {
  const key = $("groqKey").value.trim();
  const msg = $("chatInput").value.trim();
  if (!msg) return;
  if (!key) {
    appendBubble("sys", "Yuqoridagi kalit ikonka orqali API key kiriting");
    $("keyPop").classList.add("open");
    return;
  }
  localStorage.setItem("groq_api_key", key);
  $("chatInput").value = "";
  appendBubble("user", esc(msg));
  const wait = appendBubble("sys", "...");
  $("chatSend").disabled = true;

  const matches = searchLib(msg, 28);
  const matchList = matches.map(m => m.path).join("\n");
  const folderHint = navPath.length ? "Hozir foydalanuvchi papkasi: " + navPath.join("/") + "\n" : "";

  const system = "Minecraft sound finder. qoshiq/musiqa/song MUST use music/* first. Multi-topic: cover each word. 1 short sentence then PLAY: paths (max 8 from Candidates only). No SEARCH. " + (navPath.length ? "Folder: " + navPath.join("/") + ". " : "") + "Candidates: " + (matchList || "(none)");

  hist.push({ role: "user", content: msg });
  if (hist.length > 10) hist = hist.slice(-10);

  try {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
      body: JSON.stringify({
        model: MODEL,
        temperature: 0.2,
        max_tokens: 400,
        messages: [{ role: "system", content: system }].concat(hist)
      })
    });
    const json = await res.json();
    wait.remove();
    if (!res.ok) {
      appendBubble("sys", "Error: " + ((json.error && json.error.message) || res.status));
      $("chatSend").disabled = false;
      return;
    }
    const raw = (json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content) || "";
    hist.push({ role: "assistant", content: raw });
    const parsed = parseAI(raw);

    const low = msg.toLowerCase();
    // light client assist: ensure key topics appear if AI missed them
    const wantSong = /\b(qoshiq|musiqa|music|song)\b/.test(low);
    const topicMap = [
      { re: /\b(mol|cow|moo|muu|sigir)\b/, test: p => p.includes("cow") && /say|moody\/ambient/.test(p) },
      { re: /\b(chicken|tovuq)\b/, test: p => /\/chicken/.test(p) },
      { re: /\b(lava)\b/, test: p => p.includes("lava") },
      { re: /\b(qoshiq|musiqa|music|song)\b/, test: p => p.startsWith("music/") }
    ];
    for (const t of topicMap) {
      if (!t.re.test(low)) continue;
      all.filter(x => t.test(x.path)).slice(0, 6).forEach(x => {
        if (!parsed.plays.includes(x.path)) parsed.plays.push(x.path);
      });
    }
    if (wantSong) {
      const music = parsed.plays.filter(p => p.startsWith("music/"));
      const rest = parsed.plays.filter(p => !p.startsWith("music/"));
      // if AI forgot music entirely, inject top music tracks
      if (!music.length) {
        all.filter(x => x.path.startsWith("music/")).slice(0, 6).forEach(x => music.push(x.path));
      }
      parsed.plays = music.concat(rest);
    }
    parsed.plays = parsed.plays.slice(0, 8);

    let html = esc(parsed.text || raw).replace(/\n/g, "<br>");
    if (parsed.plays.length) {
      html += "<div class=\"chips\">";
      parsed.plays.forEach(p => {
        const mt = getMeta(p);
        const nm = p.split("/").pop();
        html += "<span class=\"chip\" data-path=\"" + esc(p) + "\"><span class=\"chip-ico\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"/></svg></span>" +
          "<span class=\"chip-body\"><div class=\"chip-name\">" + esc(nm) + "</div><div class=\"chip-path\">" + esc(p) + "</div>" +
          "<div class=\"chip-meta\">" + fmtDur(mt.dur) + "  ·  " + fmtSize(mt.size) + "</div></span></span>";
      });
      html += "</div>";
    }
    const el = appendBubble("ai", html, parsed.plays.length > 0);
    el.querySelectorAll(".chip").forEach(c => {
      c.addEventListener("click", () => {
        const path = c.dataset.path;
        const meta = all.find(x => x.path === path);
        play(path, meta ? meta.cat : "", null);
      });
    });
    if (parsed.plays.length) {
      const path = parsed.plays[0];
      const meta = all.find(x => x.path === path);
      play(path, meta ? meta.cat : "", null);
    }
  } catch (e) {
    wait.remove();
    appendBubble("sys", "Network: " + e.message);
  }
  $("chatSend").disabled = false;
}

function bind() {
  let t;
  $("search").addEventListener("input", e => {
    clearTimeout(t);
    t = setTimeout(() => renderStage(e.target.value), 150);
  });
  $("pIco").addEventListener("click", togglePause);
  $("vol").addEventListener("input", e => { if (audio) audio.volume = parseFloat(e.target.value); });
  $("track").addEventListener("click", seek);
  $("track").addEventListener("mousedown", e => {
    seeking = true; seek(e);
    const mv = ev => seek(ev);
    const up = () => { seeking = false; document.removeEventListener("mousemove", mv); document.removeEventListener("mouseup", up); };
    document.addEventListener("mousemove", mv);
    document.addEventListener("mouseup", up);
  });
  $("btnTheme").addEventListener("click", () => {
    const next = document.body.getAttribute("data-theme") === "light" ? "dark" : "light";
    document.body.setAttribute("data-theme", next);
    localStorage.setItem("mcsnd_theme", next);
  });
  $("btnNav").addEventListener("click", () => $("nav").classList.toggle("open"));
  $("brandHome").addEventListener("click", e => { e.preventDefault(); goNav([]); });

  const toggleChat = () => {
    $("shell").classList.toggle("chat-on");
    $("btnChat").classList.toggle("on", $("shell").classList.contains("chat-on"));
  };
  $("btnChat").addEventListener("click", toggleChat);
  $("chatClose").addEventListener("click", toggleChat);
  $("backdrop").addEventListener("click", toggleChat);
  $("btnKey").addEventListener("click", () => $("keyPop").classList.toggle("open"));
  $("btnClear").addEventListener("click", clearChat);
  $("chatLog").addEventListener("scroll", () => {
    const log = $("chatLog");
    if (log.scrollTop > 40 || chatLoaded <= 0) return;
    const prevH = log.scrollHeight;
    const more = Math.max(0, chatLoaded - 20);
    if (more === chatLoaded) return;
    const frag = renderChatSlice(more, chatLoaded);
    log.insertBefore(frag, log.firstChild);
    chatLoaded = more;
    log.scrollTop = log.scrollHeight - prevH;
  });
  $("groqKey").addEventListener("input", () => {
    const k = $("groqKey").value.trim();
    if (k) localStorage.setItem("groq_api_key", k);
  });
  $("chatSend").addEventListener("click", sendChat);
  $("chatInput").addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });

  document.addEventListener("keydown", e => {
    if (e.code !== "Space" && e.key !== " ") return;
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || e.target.isContentEditable) return;
    e.preventDefault();
    togglePause();
  });
}

init();
