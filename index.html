<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MCSOUNDS - Minecraft Sound Archive</title>
<link rel="icon" href="/png/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/png/favicon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="/png/creeper.png" type="image/png" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/png/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1b1b1b">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(function(){
  try {
    var t = localStorage.getItem("mcsnd_theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme-early", t);
  } catch(e) {}
})();
</script>
</head>
<body data-theme="dark">
<script>
(function(){
  try {
    var t = localStorage.getItem("mcsnd_theme") || "dark";
    if (t !== "light" && t !== "dark") t = "dark";
    document.body.setAttribute("data-theme", t);
    document.documentElement.setAttribute("data-theme-early", t);
  } catch(e) {}
})();
</script>
<div id="splash-flash" aria-hidden="true"></div>
<div id="splash" aria-hidden="false">
  <div class="creeper-head" role="img" aria-label="Creeper"></div>
  <div class="splash-title">MCSOUNDS</div>
  <div class="splash-sub">LOADING SOUNDS...</div>
  <div class="splash-bar"><div class="splash-fill" id="splashFill"></div></div>
</div>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="/" id="brandHome">
      <div class="brand-mark"><img src="/png/creeper.png" width="32" height="32" alt="" decoding="async"></div>
      <div class="brand-col">
        <div class="brand-text">MC<span>SOUNDS</span></div>
        <div class="brand-files" id="stats">-</div>
      </div>
    </a>
    <div class="search-wrap">
      <img class="icon" src="/svg/search.svg" alt="">
      <input type="search" id="search" placeholder="Search sounds..." autocomplete="off">
    </div>
    <div class="top-actions">
      <button class="icon-btn btn-menu" id="btnMenu" type="button" title="Folders" aria-label="Folders">
        <img class="icon" src="/svg/menu.svg" alt="">
      </button>
      <button class="icon-btn" id="btnDlAll" type="button" title="Download all sounds" aria-label="Download all">
        <img class="icon" src="/svg/download.svg" alt="">
      </button>
      <button class="icon-btn" id="btnTheme" type="button" title="Theme">
        <img class="icon" src="/svg/theme.svg" alt="">
      </button>
      <button class="icon-btn" id="btnChat" type="button" title="AI">
        <img class="icon" src="/svg/chat.svg" alt="">
        <span>AI</span>
      </button>
    </div>
  </div>
</header>

<div class="backdrop" id="backdrop"></div>
<div class="shell" id="shell">
  <nav class="nav" id="nav">
    <div class="nav-head"><div class="crumb" id="crumb"></div></div>
    <div class="nav-list" id="navList"></div>
  </nav>

  <main class="stage">
    <div class="stage-head">
      <button type="button" class="btn-back" id="btnBack" title="Back" aria-label="Back">
        <img class="icon" src="/svg/back.svg" alt="">
      </button>
      <div class="stage-title" id="stageTitle">ROOT</div>
    </div>
    <div class="folder-grid" id="folderGrid"></div>
    <div class="cards" id="grid">
      <div class="load">
        <div class="load-bar"><div class="load-fill" id="loadFill"></div></div>
        <div class="load-txt" id="loadTxt">INDEXING</div>
      </div>
    </div>
  </main>

  <aside class="chat" id="chat">
    <div class="chat-hd">
      <button class="icon-btn chat-close-left" id="chatClose" type="button" title="Close panel" aria-label="Close">
        <img class="icon" src="/svg/panel-close.svg" alt="">
      </button>
      <h3 class="mc-ai-title"><span class="mc">MC</span> <span class="ai">AI</span></h3>
      <div class="chat-hd-actions">
        <button class="icon-btn hidden" id="btnClear" type="button" title="Clear chat">
          <img class="icon" src="/svg/panel-close.svg" alt="">
        </button>
        <button class="icon-btn" id="btnKey" type="button" title="API Key">
          <img class="icon" src="/svg/panel-close.svg" alt="">
        </button>
      </div>
    </div>
    <div class="key-pop" id="keyPop">
      <div class="key-connected" id="keyConnected" hidden>
        <div class="key-connected-row">
          <span class="key-dot" aria-hidden="true"></span>
          <span>API key connected</span>
        </div>
        <button type="button" class="key-action" id="keyChange">Change</button>
        <button type="button" class="key-action danger" id="keyRemove">Remove</button>
      </div>
      <div class="key-entry" id="keyEntry">
        <label for="groqKey">Groq API key</label>
        <input type="text" id="groqKey" placeholder="Paste key (gsk_...)" autocomplete="off" spellcheck="false" inputmode="text">
        <button type="button" class="key-save" id="keySave">Save</button>
        <div class="key-status" id="keyStatus"></div>
      </div>
    </div>
    <div class="chat-log" id="chatLog">
      <div class="ask-hero" id="askHero"><div class="ask-title">ASK AI</div><div class="ask-sub">ENTER API KEY TO START</div></div>
    </div>
    <div class="chat-in">
      <input type="text" id="chatInput" placeholder="What sound?" autocomplete="off">
      <button type="button" id="chatSend" class="send-btn" title="Send" aria-label="Send">
        <img class="icon" src="/svg/send.svg" alt="">
      </button>
    </div>
  </aside>
</div>


<div class="dl-modal-bg" id="dlModal" role="dialog" aria-modal="true" aria-labelledby="dlModalTitle">
  <div class="dl-modal">
    <h2 id="dlModalTitle">DOWNLOAD SOUNDS</h2>
    <p id="dlModalText">Download all sounds?<br>Only .ogg files (~370 MB). No code files.</p>
    <div class="dl-progress" id="dlProgress">
      <div class="bar"><i id="dlBar"></i></div>
      <div class="txt" id="dlStatus">Preparing...</div>
    </div>
    <div class="dl-actions">
      <button type="button" class="dl-btn" id="dlCancel">Cancel</button>
      <button type="button" class="dl-btn primary" id="dlConfirm">Yes, download</button>
    </div>
  </div>
</div>

<div class="player" id="player">
  <div class="player-inner">
    <div class="player-row">
      <div class="player-ico" id="pIco">
        <img class="icon" id="pIcoSvg" src="/svg/play.svg" alt="">
        <div class="spin-wrap hidden" id="pSpin"><div class="spin-ring"></div><span class="spin-pct" id="pPct">0%</span></div>
      </div>
      <div class="player-meta">
        <div class="player-name" id="pName">-</div>
        <div class="player-path" id="pPath">-</div>
      </div>
      <div class="player-ctrls">
        <button class="icon-btn" id="pDl" type="button" title="Download sound" aria-label="Download">
          <img class="icon" src="/svg/download.svg" alt="">
        </button>
        <input type="range" class="vol" id="vol" min="0" max="1" step="0.05" value="0.7">
      </div>
    </div>
    <div class="prog">
      <time id="tCur">0:00</time>
      <div class="track" id="track"><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div></div>
      <time id="tTot">0:00</time>
    </div>
  </div>
</div>


<script src="/js/app.js"></script>
</body>
</html>
