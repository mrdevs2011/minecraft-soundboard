<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Key bow outer -->
  <rect x="2" y="2" width="6" height="6" fill="#ffffff"/>
  <!-- Key bow hole -->
  <rect x="4" y="4" width="2" height="2" fill="#1b1b1b"/>
  <!-- Shaft -->
  <rect x="4" y="8" width="2" height="6" fill="#ffffff"/>
  <!-- Teeth -->
  <rect x="6" y="9" width="2" height="1" fill="#ffffff"/>
  <rect x="6" y="11" width="3" height="1" fill="#ffffff"/>
</svg>
